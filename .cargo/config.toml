[build]
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32"
ESP_IDF_VERSION = "v5.3.3"

[alias]
# Tests sur PC de la logique indépendante du matériel (cargo test-core)
test-core = "test -p timeflow-core --target x86_64-unknown-linux-gnu"
