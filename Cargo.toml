[package]
name = "timeflow"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.77"
license = "Apache-2.0"

[[bin]]
name = "timeflow"
harness = false   # pas de tests sur la cible ESP32

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
log = "0.4"
anyhow = "1"
esp-idf-svc = "0.51"
max7219 = "0.5"

[build-dependencies]
embuild = "0.33"
toml = "0.8"
